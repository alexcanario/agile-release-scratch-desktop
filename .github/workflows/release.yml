# Release pipeline, generated by agile@canary (`node sync.js pipeline write`; /agile:sync only offers it). It is yours once written: edit it freely.
# Run it by hand (Actions > Release > Run workflow) or let /agile:publish dispatch it: no push, schedule or merge starts it.
# It does on a runner what /agile:publish does on your machine, for the heads a runner packs with no new secret: web, API, desktop heads
# packed as unsigned zips, Velopack heads with no code signing (GitHub source of this repository, or an https feed) and the NuGet packages of an
# app in its own repository. The release job runs on windows-latest when docs/infra.md declares an update source (a Velopack head is packed there:
# Setup.exe, the AppImage and the feed), on ubuntu-latest otherwise; an https feed is kept as the artifact velopack-<tag> of the run for 30 days. It commits docs/releases/<tag>.md to the main branch, tags it
# (annotated, with the notes), pushes both, creates the GitHub Release and, when deploy.yml exists and the input is on, dispatches Deploy for
# the new tag to the target named once below. A signed, Mobile, share-fed or other-repository Velopack head stops the run before anything is committed or tagged:
# `/agile:publish --local` releases it from your machine.
# The commit and the push use the run's GITHUB_TOKEN (contents: write). A main branch that requires pull requests or status checks refuses it:
# relax the rule for the GitHub Actions bot, or release with `/agile:publish --local`. The packages go to the GitHub Packages feed of this
# repository's owner with the same token (packages: write); a feed that refuses it leaves the packages out and the release stands.
# The Glossary step of /agile:publish is a model's judgment made on your machine: a run started here skips it and says so.
name: Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Dispatch Deploy for the new tag to staging when the release is done'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # `pipeline write` renders windows-latest here when docs/infra.md declares an update source (a Velopack head is packed on Windows).
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Keep the line endings of the repository
        run: git config --global core.autocrlf false
      - name: Check out the main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/agile-release.js
      - name: Keep the Velopack feed for an https update source
        if: steps.release.outputs.velopack_artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.velopack_artifact }}
          path: ${{ steps.release.outputs.velopack_paths }}
          retention-days: 30
          if-no-files-found: ignore
  deploy:
    name: Deploy the new tag
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      AGILE_TAG: ${{ needs.release.outputs.tag }}
      AGILE_ENVIRONMENT: 'staging'
      AGILE_DEPLOY: ${{ inputs.deploy }}
    steps:
      - name: Check out the pipeline files
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Dispatch Deploy
        run: node .github/scripts/agile-release.js ci-deploy
