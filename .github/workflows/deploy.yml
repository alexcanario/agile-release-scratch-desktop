# Deploy pipeline, generated by agile@canary (/agile:bootstrap; /agile:sync only offers it). It is yours once written: edit it freely.
# A pushed tag v<Version> deploys to the first environment of docs/infra.md that is neither local nor production (staging), or to
# production when there is no other: the name is written once, as a literal, where this file says it below. Production is promoted by a
# manual run (Actions > Deploy > Run workflow: environment and an existing tag) or locally by /agile:publish production.
# What is deployed is the "Deploy command" of that environment's row in docs/infra.md, read when the run starts: edit the table, not this file.
# Secrets: the names below are the ones docs/infra.md lists as "environment variable" for a non-local environment. Add each one to the
# GitHub environment of the same name (Settings > Environments); required reviewers are set there too. The plugin never reads a value.
# An Azure environment (a row of `## Cloud accounts` in docs/infra.md with Cloud azure): the job logs in to the client's tenant by OIDC (azure/login), with the
# GitHub environment's variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (variables, not secrets), and agile-deploy.js checks the login
# against the row. That check catches a misconfiguration; the boundary is the environment's deployment protection rule (selected tags `v*`, reviewers on production).
# An AWS environment (Cloud aws): aws-actions/configure-aws-credentials logs in by OIDC with the GitHub environment's variables AWS_ROLE_ARN and AWS_REGION. A Google Cloud
# environment (Cloud gcp): google-github-actions/auth and setup-gcloud, with GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (and GCP_PROJECT_ID when the table has
# more than one project). Variables, never secrets; agile-deploy.js checks the account or project the login sees against the row, the same way.
# A tool the command needs beyond the .NET SDK and what ubuntu-latest has: add a step before "Deploy".
name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to: a row of the environments table in docs/infra.md'
        required: true
        type: string
      tag:
        description: 'Existing tag to deploy, e.g. v0.3.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      AGILE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      AGILE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # The pipeline's own script comes from the commit that holds this workflow, so a rollback to a tag older than the pipeline still runs.
      - name: Check out the pipeline script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.AGILE_TAG }}
          fetch-depth: 0
          path: tag
      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: tag/global.json
      - name: Deploy
        working-directory: tag
        # Only this step sees the secrets: the names are the ones docs/infra.md lists for a non-local environment.
        env:
          AGILE_PIPELINE: github-actions
        run: node "$GITHUB_WORKSPACE/.github/scripts/agile-deploy.js"
